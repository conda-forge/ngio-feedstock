{% set name = "ngio" %}
{% set version = "1.0.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/ngio-{{ version }}.tar.gz
  sha256: 466bf21ab23e2e104e045bfc8e9173bbbd9dd2df4cc0535b06bf881eea7b87a1

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - filelock
    - zarr >3
    - anndata >=0.12.0,<0.13.0
    - pydantic
    - pandas >=1.2.0,<3.0.0
    - requests
    - aiohttp
    - dask
    - distributed
    # - xarray
    - ome-zarr-models
    - pooch
    - polars
    - pyarrow
    - pillow

test:
  imports:
    - ngio
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/fractal-analytics-platform/ngio
  summary: Next Generation file format IO
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - lorenzocerrone
    - jluethi
    - tcompa
